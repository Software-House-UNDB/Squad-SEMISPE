services:
  semispe-db:
    image: mysql:8.3
    container_name: semispe-db
    environment:
      MYSQL_ROOT_PASSWORD: root_semispe
      MYSQL_DATABASE: semispe
      MYSQL_USER: semispe
      MYSQL_PASSWORD: semispe
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    networks:
      - semispe-network

  semispe-back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semispe-back
    depends_on:
      - semispe-db
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: semispe-db
      DB_PORT: 3306
      DB_USERNAME: semispe
      DB_PASSWORD: semispe
      DB_DATABASE: semispe
      JWT_SECRET: change-me
      JWT_EXPIRES_IN: 1d
      # Lidas do .env da raiz (copie de .env.example)
      AURASSURE_ACCESS_ID: ${AURASSURE_ACCESS_ID:-}
      AURASSURE_ACCESS_KEY: ${AURASSURE_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - semispe_back_node_modules:/app/node_modules
    networks:
      - semispe-network

  semispe-front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semispe-front
    depends_on:
      - semispe-back
    environment:
      VITE_API_URL: http://localhost:3000/api/
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - semispe_front_node_modules:/app/node_modules
    networks:
      - semispe-network

networks:
  semispe-network:
    driver: bridge

volumes:
  semispe_back_node_modules:
  semispe_front_node_modules:
