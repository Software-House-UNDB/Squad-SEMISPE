# Publica o site (frontend) no GitHub Pages a cada push na developer.
#
# Fluxo: push na developer -> testa e compila o frontend -> grava o build na
# branch gh-pages -> o GitHub Pages serve a gh-pages ("Deploy from a branch").
# A gh-pages e so a saida do build: nao edite nem faca merge nela (cada deploy
# apaga e recria o conteudo, exceto o stations.json, mantido pelo workflow
# update-stations).
#
# So roda quando algo em frontend/ muda; use "Run workflow" na aba Actions para
# publicar manualmente (por exemplo, depois de cadastrar VITE_API_URL).
#
# Configuracao no GitHub:
#   - Settings > Pages > Source: "Deploy from a branch" > gh-pages / (root)
#   - Settings > Environments > github-pages: permitir a branch "gh-pages"
#   - Settings > Secrets and variables > Actions > Variables (opcional):
#     VITE_API_URL = URL publica do backend, terminada em /api
#     Sem ela, so a pagina Ar funciona (le o stations.json).
name: Deploy Pages (gh-pages)

on:
  push:
    branches: [developer]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/publish-gh-pages.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vitest 5 / jsdom 31 exigem Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - name: Avisar se a URL da API nao estiver configurada
        if: ${{ vars.VITE_API_URL == '' }}
        run: echo "::warning::VITE_API_URL nao esta cadastrada. A pagina Ar usa o stations.json, mas as demais paginas que dependem da API (reservas, contato, ideias, login) vao falhar."

      # Gera o site com base /Squad-SEMISPE/ (HashRouter em producao no Pages).
      - run: npm run build:pages
        working-directory: frontend
        env:
          # Variavel (nao secret): vai para o bundle publico. Credenciais da
          # Aurassure NUNCA entram aqui, ficam so nos Secrets / no backend.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Publicar o build na branch gh-pages
        run: |
          bash .github/scripts/publish-gh-pages.sh site frontend/dist "deploy: developer @ ${GITHUB_SHA::7}"
